<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RektBull</title>
  <style>
    :root { --text: #15181d; --muted: #5d6673; --line: #dde1e7; --accent: #1f6feb; --bad: #cf222e; --bg: #fff; }
    @media (prefers-color-scheme: dark) { :root { --text: #e6edf3; --muted: #8d96a0; --line: #30363d; --accent: #388bfd; --bad: #f85149; --bg: #161b22; } }
    body { margin: 0; width: 340px; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { padding: 14px; display: grid; gap: 10px; }
    h1 { font-size: 16px; margin: 0; } .muted { color: var(--muted); font-size: 13px; }
    button { font: inherit; padding: 7px 12px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--text); cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .alert { border-left: 3px solid var(--bad); padding-left: 8px; font-size: 13px; }
    label { font-size: 13px; display: flex; gap: 6px; align-items: center; }
    input[type=url] { font: inherit; width: 100%; box-sizing: border-box; padding: 6px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--text); }
  </style>
</head>
<body>
  <main>
    <h1>RektBull</h1>
    <div id="status" class="muted">Loading…</div>
    <div id="alerts"></div>
    <div id="actions" style="display:flex;gap:8px;flex-wrap:wrap"></div>
    <label><input type="checkbox" id="warn-medium"> Also stop me on medium-risk requests</label>
    <details class="muted"><summary>Advanced</summary><label style="display:block">RektBull address<input type="url" id="api-base"></label></details>
  </main>
  <script src="popup.js"></script>
</body>
</html>
