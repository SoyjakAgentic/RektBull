name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rb
          POSTGRES_PASSWORD: rb
          POSTGRES_DB: rektbull_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://rb:rb@localhost:5432/rektbull_test

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - run: npm test

  autonomous-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rb
          POSTGRES_PASSWORD: rb
          POSTGRES_DB: rektbull_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci && npx hardhat compile
        working-directory: contracts
      - run: node --test test/autonomous.e2e.js
        env:
          TEST_DATABASE_URL: postgres://rb:rb@localhost:5432/rektbull_test
      - run: node --test test/approvals.e2e.js
        env:
          TEST_DATABASE_URL: postgres://rb:rb@localhost:5432/rektbull_test
      - run: node --test test/claims.e2e.js
        env:
          TEST_DATABASE_URL: postgres://rb:rb@localhost:5432/rektbull_test
      - run: node --test test/yield.e2e.js
        env:
          TEST_DATABASE_URL: postgres://rb:rb@localhost:5432/rektbull_test
      - run: node --test test/governors.e2e.js
        env:
          TEST_DATABASE_URL: postgres://rb:rb@localhost:5432/rektbull_test

  snap:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: snap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: snap/package-lock.json
      - run: npm ci
      - run: npm test
      # The committed manifest must match the production bundle (its shasum).
      - run: git diff --exit-code snap.manifest.json
  analyzer:
    # The contract analyzer (analyzer/) built as Cloud Run runs it: it must
    # find the bugs planted in a broken vault, refuse a path outside its work
    # directory, and serve RektBull's own audit code (test/contractAudit.test.js).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: The analyzer's own checks
        run: python3 -m unittest discover analyzer/test
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: analyzer
          push: false
          load: true
          tags: rektbull-analyzer:ci
          cache-from: type=gha,scope=analyzer
          cache-to: type=gha,mode=max,scope=analyzer
      - name: Slither finds the planted bugs
        run: |
          echo "image size: $(docker image inspect -f '{{.Size}}' rektbull-analyzer:ci | awk '{printf "%.0f MB", $1/1000000}')"
          docker run -d --name analyzer -p 8080:8080 rektbull-analyzer:ci
          for i in $(seq 1 30); do curl -sf localhost:8080/healthz && break; sleep 1; done
          curl -s -X POST --data-binary @analyzer/test/vulnerable.json localhost:8080/analyze > result.json
          node -e "
            const r = require('./result.json');
            const found = new Set((r.findings || []).map(f => f.check));
            console.log(JSON.stringify({ solc: r.solc, slither: r.slither, detectors: r.detectors, seconds: r.seconds, checks: [...found] }));
            const missing = ['reentrancy-eth', 'unchecked-transfer', 'uninitialized-state'].filter(c => !found.has(c));
            if (missing.length) { console.error('missing:', missing, JSON.stringify(r).slice(0, 2000)); process.exit(1); }
          "
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -d '{"compiler":"0.8.24","sources":{"../x.sol":"x"}}' localhost:8080/analyze)
          [ "$code" = 400 ] || { echo "a path outside the work directory answered $code"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: RektBull's audit against the real analyzer
        run: ANALYZER_URL=http://127.0.0.1:8080 node --test test/contractAudit.test.js
