name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rb
          POSTGRES_PASSWORD: rb
          POSTGRES_DB: rektbull_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://rb:rb@localhost:5432/rektbull_test

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - run: npm test

  autonomous-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rb
          POSTGRES_PASSWORD: rb
          POSTGRES_DB: rektbull_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci && npx hardhat compile
        working-directory: contracts
      - run: node --test test/autonomous.e2e.js
        env:
          TEST_DATABASE_URL: postgres://rb:rb@localhost:5432/rektbull_test
      - run: node --test test/approvals.e2e.js
        env:
          TEST_DATABASE_URL: postgres://rb:rb@localhost:5432/rektbull_test
      - run: node --test test/claims.e2e.js
        env:
          TEST_DATABASE_URL: postgres://rb:rb@localhost:5432/rektbull_test

  snap:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: snap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: snap/package-lock.json
      - run: npm ci
      - run: npm test
      # The committed manifest must match the production bundle (its shasum).
      - run: git diff --exit-code snap.manifest.json
